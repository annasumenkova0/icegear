<!DOCTYPE html>
<html class="light" lang="et">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#f9f9f9",
            "on-background": "#1a1c1c",
            "on-surface-variant": "#43474a",
            "on-surface": "#1a1c1c",
            "primary": "#111d23",
            "on-primary": "#ffffff",
            "primary-fixed-dim": "#bbc8d0",
            "on-tertiary-container": "#00a1ea",
            "on-tertiary-fixed-variant": "#004b70",
            "outline-variant": "#c3c7ca",
            "outline": "#73787a",
            "error": "#ba1a1a",
            "surface-container-low": "#f3f3f4",
            "surface-container": "#eeeeee",
            "surface-container-high": "#e8e8e8",
            "surface-container-highest": "#e2e2e2",
            "tertiary-fixed": "#cae6ff",
            "on-tertiary-fixed": "#001e30",
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem",
          },
          spacing: {
            "unit": "4px", "gutter": "16px", "xl": "48px",
            "xs": "4px", "sm": "8px", "md": "16px", "lg": "24px",
            "margin-mobile": "16px", "margin-desktop": "64px", "max-width": "1200px",
          },
          fontFamily: {
            "headline-lg-mobile": ["Inter"], "label-sm": ["Inter"],
            "title-md": ["Inter"], "body-md": ["Inter"],
            "body-lg": ["Inter"], "display-lg": ["Inter"], "headline-lg": ["Inter"],
          },
          fontSize: {
            "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
            "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
            "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
            "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }],
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/shared/styles.css"/>
  <style>
    body { min-height: 100dvh; }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">

<header class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-md border-b border-on-surface/10 shadow-[0_20px_20px_rgba(0,0,0,0.04)]">
  <div class="flex justify-between items-center px-4 h-16 w-full max-w-max-width mx-auto">
    <div class="w-12 flex justify-start">
      <a href="/" class="material-symbols-outlined text-primary p-2 hover:opacity-80 transition-opacity">home</a>
    </div>
    <h1 class="font-display-lg text-headline-lg-mobile tracking-tight text-primary text-center flex-1">icegear</h1>
    <div class="w-12 flex justify-end">
      <a href="/" class="material-symbols-outlined text-primary p-2 hover:opacity-80 transition-opacity">search</a>
    </div>
  </div>
</header>

<main id="main-content" class="pt-24 px-4 pb-12 max-w-max-width mx-auto space-y-8">
  <div class="flex items-center justify-center h-64">
    <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
  </div>
</main>

<script>
  const MONTHS = ['', 'Jaan', 'Veebr', 'Märts', 'Apr', 'Mai', 'Juuni', 'Juuli', 'Aug', 'Sept', 'Okt', 'Nov', 'Dets'];

  function stockHTML(stock) {
    if (stock === 0) return '<span class="text-error font-bold text-sm">Otsas</span>';
    if (stock >= 5) return '<span class="text-primary font-bold text-sm">5+ saadaval</span>';
    return `<span class="text-primary font-bold text-sm">${stock} tk saadaval</span>`;
  }

  function priceHTML(price, originalPrice) {
    if (originalPrice) {
      return `<div class="font-bold text-primary">
        <span class="text-on-surface-variant/60 line-through text-xs mr-1">${originalPrice.toFixed(2)}€</span>
        <span class="text-error">${price.toFixed(2)}€</span>
      </div>`;
    }
    return `<div class="font-bold text-primary">${price.toFixed(2)}€</div>`;
  }

  function storeCardHTML(store) {
    return `
      <a href="${store.shelf_note || '#'}" class="block hover:opacity-80 transition-opacity">
        <div class="p-4 border border-outline-variant rounded-xl flex justify-between items-center bg-white">
          <div>
            <h4 class="font-title-md text-base text-primary">${store.store_name}</h4>
            <p class="text-on-surface-variant text-sm">${store.location}</p>
          </div>
          <div class="text-right">
            ${priceHTML(store.price, store.original_price)}
            ${stockHTML(store.stock)}
          </div>
        </div>
      </a>
    `;
  }

  function priceBarHTML(entry, maxPrice, isCurrent) {
    const height = Math.max(16, Math.round((entry.price / maxPrice) * 96));
    const colorClass = isCurrent ? 'bg-primary' : 'bg-primary-fixed-dim/40';
    const labelClass = isCurrent ? 'font-bold text-primary' : 'text-on-surface-variant';
    return `
      <div class="flex flex-col items-center flex-1 gap-2">
        <span class="text-[10px] ${labelClass}">${Math.round(entry.price)}€</span>
        <div class="w-full ${colorClass} rounded-t-lg" style="height:${height}px"></div>
        <span class="font-label-sm text-[10px] text-on-surface-variant uppercase">${MONTHS[entry.month]}</span>
      </div>
    `;
  }

  function renderProduct(p) {
    const storeCount = p.stores.length;
    const maxPrice = p.price_history.length ? Math.max(...p.price_history.map(h => h.price)) : 1;
    const lastHistoryIndex = p.price_history.length - 1;

    document.getElementById('main-content').innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <div class="lg:col-span-7 relative aspect-square glass-card rounded-full overflow-hidden flex items-center justify-center p-8 group">
          <img
            alt="${p.name}"
            class="w-full h-full object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-500"
            src="${p.image_url}"
          />
          ${p.badge ? `<div class="absolute top-6 left-6 bg-tertiary-fixed text-on-tertiary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm">${p.badge}</div>` : ''}
        </div>

        <div class="lg:col-span-5 flex flex-col gap-6">
          <div>
            <h2 class="font-headline-lg text-headline-lg text-primary mb-2">${p.name}</h2>
          </div>
          <p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">${p.description}</p>

          <section class="mt-4">
            <h3 class="font-headline-lg text-headline-lg mb-4">Tehnilised andmed</h3>
            <div class="divide-y divide-on-surface/10">
              ${p.specs.map(s => `
                <div class="flex justify-between py-4">
                  <span class="text-on-surface-variant">${s.key}</span>
                  <span class="font-semibold text-sm">${s.value}</span>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      </div>

      <section class="mt-xl space-y-6">
        <div class="flex items-center justify-between">
          <h3 class="font-headline-lg text-headline-lg">Kaupluste saadavus</h3>
          <span class="bg-primary/5 text-primary px-3 py-1 rounded-full text-label-sm font-label-sm">Kokku ${storeCount} asukohta</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${p.stores.map(storeCardHTML).join('')}
        </div>
      </section>

      ${p.price_history.length ? `
        <section class="mt-xl">
          <div class="glass-card p-6 rounded-3xl">
            <div class="flex justify-between items-end mb-6">
              <h3 class="font-title-md text-title-md text-primary">Hinnaajalugu</h3>
              <span class="font-label-sm text-label-sm text-on-tertiary-fixed-variant">Viimased 6 kuud</span>
            </div>
            <div class="flex items-end justify-between h-32 gap-3 px-2">
              ${p.price_history.map((entry, i) => priceBarHTML(entry, maxPrice, i === lastHistoryIndex)).join('')}
            </div>
          </div>
        </section>
      ` : ''}
    `;
  }

  async function init() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) {
      location.href = '/';
      return;
    }

    const res = await fetch(`/api/products/${id}`);
    if (!res.ok) {
      location.href = '/';
      return;
    }

    const product = await res.json();
    document.title = `${product.name} — IceGear`;
    renderProduct(product);
  }

  init();
</script>

</body>
</html>
